        // --- Data Service ---
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUYQGdhyZVe--2uuwb4dgfi44pBg_Rk6yj7zdlNmWg0F_rAJg2z2V7gkBWHsGznsg-VsEWAjNeUG5q/pub?output=csv";

        let cachedDataPromise = null;
        let isDataCached = false;

        async function fetchScrapData(category) {
            const cacheBuster = new Date().getTime();
            const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUYQGdhyZVe--2uuwb4dgfi44pBg_Rk6yj7zdlNmWg0F_rAJg2z2V7gkBWHsGznsg-VsEWAjNeUG5q/pub?output=csv";
            const RAW_CSV_URL = "https://script.google.com/macros/s/AKfycbwgP4jhdt0rom8RB3r3yvc42Xg-kgB4FgJ2DQTVOFHTir1g6mVFjCAMW5BB0dpbFbSARg/exec?action=getRawScrap";
            const PROD_URL = "https://script.google.com/macros/s/AKfycbwgP4jhdt0rom8RB3r3yvc42Xg-kgB4FgJ2DQTVOFHTir1g6mVFjCAMW5BB0dpbFbSARg/exec?action=getData&startDate=2020-01-01&endDate=2030-12-31";
            
            try {
                if (!cachedDataPromise) {
                    cachedDataPromise = Promise.all([
                        new Promise((resolve, reject) => {
                            Papa.parse(`${CSV_URL}&t=${cacheBuster}`, { download: true, header: false, complete: resolve, error: reject });
                        }),
                        fetch(`${RAW_CSV_URL}&t=${cacheBuster}`).then(async (res) => {
                            const text = await res.text();
                            try {
                                const jsonData = JSON.parse(text);
                                if (jsonData.error) throw new Error(jsonData.error);
                                // If it's a JSON array of arrays (or objects), wrap it so it matches PapaParse output format
                                return { data: Array.isArray(jsonData) ? jsonData : (jsonData.data || jsonData.items || Object.values(jsonData)) };
                            } catch (e) {
                                return new Promise((resolve, reject) => {
                                    // Fallback to fetching directly from the spreadsheet CSV export if App Script returns error/invalid format
                                    const SHEET_EXPORT_URL = "https://docs.google.com/spreadsheets/d/1GHwq2tHt0ZDwuGHfTZSov6b2JgfURUKt7c8WLZWPGKs/export?format=csv&gid=359852687";
                                    Papa.parse(`${SHEET_EXPORT_URL}&t=${cacheBuster}`, { 
                                        download: true, 
                                        header: false, 
                                        complete: resolve, 
                                        error: (err) => {
                                            // If spreadsheet export also fails (e.g. not public), fallback to parsing the raw text we first received
                                            Papa.parse(text, { header: false, complete: resolve, error: reject });
                                        }
                                    });
                                });
                            }
                        }),
                        fetch(`${PROD_URL}&t=${cacheBuster}`).then(r => r.json()).catch(() => ({ summaries: [] })),
                        new Promise((resolve, reject) => {
                            const newCsvUrl = "https://docs.google.com/spreadsheets/d/1GHwq2tHt0ZDwuGHfTZSov6b2JgfURUKt7c8WLZWPGKs/export?format=csv&gid=805147683";
                            Papa.parse(`${newCsvUrl}&t=${cacheBuster}`, { download: true, header: false, complete: resolve, error: reject });
                        }).catch(() => null)
                    ]).then(res => {
                        isDataCached = true;
                        return res;
                    });
                }
                const [oldData, newData, prodDataReq, newCsvData] = await cachedDataPromise;

                const monthlyDataMap = {};
                for (let i = 1; i <= 12; i++) {
                    const monthStr = i.toString().padStart(2, "0");
                    monthlyDataMap[monthStr] = {};
                }

                const oldRows = oldData.data ? oldData.data.slice(2) : [];
                oldRows.forEach((row) => {
                    if (!row[0] || !row[0].includes("/")) return;
                    const dateParts = row[0].split("/");
                    let month, year;
                    if (dateParts.length === 2) {
                        month = dateParts[0].padStart(2, "0");
                        year = dateParts[1];
                    } else if (dateParts.length === 3) {
                        const d = new Date(row[0]);
                        if (!isNaN(d.getTime())) {
                            month = (d.getMonth() + 1).toString().padStart(2, "0");
                            year = d.getFullYear().toString();
                        } else {
                            month = dateParts[1].padStart(2, "0");
                            year = dateParts[2];
                        }
                    }
                    if (!month || !year) return;

                    const getVal = (idx) => {
                        const val = parseFloat(row[idx]);
                        return isNaN(val) ? null : val;
                    };

                    let prodWeight = null;
                    if (category === 'MX_RB' || category === 'MX_CB' || category === 'MX_CHM' || category === 'RUBBER ALL') prodWeight = getVal(2);
                    else if (category === 'EX_RB') prodWeight = getVal(6);
                    else if (category === 'CL_PLY' || category === 'PLY ALL') prodWeight = getVal(8);
                    else if (category === 'CL_FABRIC') prodWeight = getVal(10);
                    else if (category === 'CL_RB') prodWeight = getVal(12);
                    else if (category === 'CL_CH') prodWeight = getVal(14);
                    else if (category === 'CT_CH' || category === 'CH ALL') prodWeight = getVal(16);
                    else if (category === 'CT_RB') prodWeight = getVal(18);
                    else if (category === 'CT_PLY') prodWeight = getVal(20);
                    else if (category === 'CT_BW' || category === 'BW ALL') prodWeight = getVal(22);
                    else if (category === 'BD_RB') prodWeight = getVal(24);
                    else if (category === 'BD_PLY') prodWeight = getVal(26);
                    else if (category === 'BD_CH') prodWeight = getVal(28);
                    else if (category === 'BD_BW') prodWeight = getVal(30);
                    else if (category === 'CUR_RB') prodWeight = getVal(32);
                    else if (category === 'RSIP_RB') prodWeight = getVal(34);
                    else if (category === 'RSIP_PLY') prodWeight = getVal(36);
                    else if (category === 'RSIP_CH') prodWeight = getVal(38);
                    else if (category === 'PLY/CH ALL' || category === 'CT_CL PLY/CH ALL') {
                        const pProd = getVal(8);
                        const cProd = getVal(16);
                        if (pProd !== null || cProd !== null) prodWeight = (pProd || 0) + (cProd || 0);
                    }

                    if (!monthlyDataMap[month][year]) {
                        monthlyDataMap[month][year] = { prodWeight: null, scrapPercentRubber: null, scrapPercentPlyChafer: null, scrapPercentBW: null };
                        const fields = ['mxRubber','mxCbRubber','mxChmRubber','exRubber','clPlyRubber','clFabricRubber','clRbRubber','clRubber','clChRubber','ctChRubber','ctRbRubber','ctRubber','ctPlyRubber','ctBwRubber','bdRbRubber','bdPlyRubber','bdChRubber','bdBwRubber','curingRubber','rispRubber','rispPlyRubber','rispChRubber','exPlyRubber'];
                        fields.forEach(f => { monthlyDataMap[month][year][f] = 0; });
                    }
                    
                    monthlyDataMap[month][year].prodWeight = prodWeight;
                    monthlyDataMap[month][year].scrapPercentRubber = getVal(39);
                    monthlyDataMap[month][year].scrapPercentPlyChafer = getVal(40);
                    monthlyDataMap[month][year].scrapPercentBW = getVal(41);
                });

                if (prodDataReq && prodDataReq.summaries) {
                    prodDataReq.summaries.forEach((row) => {
                        const dateStr = row.date;
                        if (!dateStr) return;
                        const d = new Date(dateStr);
                        if (isNaN(d.getTime())) return;
                        d.setUTCHours(d.getUTCHours() + 12);
                        const month = (d.getUTCMonth() + 1).toString().padStart(2, "0");
                        const year = d.getUTCFullYear().toString();

                        if (!monthlyDataMap[month]) monthlyDataMap[month] = {};
                        if (!monthlyDataMap[month][year]) {
                            monthlyDataMap[month][year] = { prodWeight: null, scrapPercentRubber: null, scrapPercentPlyChafer: null, scrapPercentBW: null };
                            const fields = ['mxRubber','mxCbRubber','mxChmRubber','exRubber','clPlyRubber','clFabricRubber','clRbRubber','clRubber','clChRubber','ctChRubber','ctRbRubber','ctRubber','ctPlyRubber','ctBwRubber','bdRbRubber','bdPlyRubber','bdChRubber','bdBwRubber','curingRubber','rispRubber','rispPlyRubber','rispChRubber','exPlyRubber'];
                            fields.forEach(f => { monthlyDataMap[month][year][f] = 0; });
                        }

                        let addedProdWeight = 0;
                        const isBW = ['CT_BW', 'BD_BW', 'BW ALL'].includes(category);
                        const isPlyCh = ['CL_PLY', 'PLY ALL', 'CT_PLY', 'BD_PLY', 'RSIP_PLY', 'CL_CH', 'CT_CH', 'CH ALL', 'BD_CH', 'RSIP_CH', 'PLY/CH ALL', 'CT_CL PLY/CH ALL', 'CL_FABRIC'].includes(category);
                        const isRubber = ['MX_RB', 'MX_CB', 'MX_CHM', 'EX_RB', 'CL_RB', 'CT_RB', 'BD_RB', 'CUR_RB', 'RSIP_RB', 'RUBBER ALL'].includes(category);
                        
                        if (isBW) {
                             addedProdWeight = parseFloat(row.bicUsage) || 0;
                        } else if (isPlyCh) {
                             addedProdWeight = parseFloat(row.plyUsage) || 0;
                        } else if (isRubber) {
                             addedProdWeight = parseFloat(row.rubberUsage) || 0;
                        }

                        if (addedProdWeight > 0) {
                            if (monthlyDataMap[month][year].newProdWeight === undefined) {
                                monthlyDataMap[month][year].newProdWeight = 0;
                            }
                            monthlyDataMap[month][year].newProdWeight += addedProdWeight;
                        }
                    });
                }

                if (newCsvData && newCsvData.data) {
                    newCsvData.data.forEach((row) => {
                       const dateStr = String(row[0]).trim();
                       if (!dateStr || dateStr === 'Date' || dateStr.toUpperCase() === 'DATE') return;
                       
                       const d = new Date(dateStr);
                       if (isNaN(d.getTime())) return;
                       d.setUTCHours(d.getUTCHours() + 12);
                       const month = (d.getUTCMonth() + 1).toString().padStart(2, "0");
                       const year = d.getUTCFullYear().toString();

                       if (!monthlyDataMap[month]) monthlyDataMap[month] = {};
                       if (!monthlyDataMap[month][year]) {
                           monthlyDataMap[month][year] = { prodWeight: null, scrapPercentRubber: null, scrapPercentPlyChafer: null, scrapPercentBW: null };
                           const fields = ['mxRubber','mxCbRubber','mxChmRubber','exRubber','clPlyRubber','clFabricRubber','clRbRubber','clRubber','clChRubber','ctChRubber','ctRbRubber','ctRubber','ctPlyRubber','ctBwRubber','bdRbRubber','bdPlyRubber','bdChRubber','bdBwRubber','curingRubber','rispRubber','rispPlyRubber','rispChRubber','exPlyRubber'];
                           fields.forEach(f => { monthlyDataMap[month][year][f] = 0; });
                       }
                       
                       // Column O is 14 (Rubber), P is 15 (PLY/CH), Q is 16 (BW)
                       const parseTarget = (val) => {
                           if (val === undefined || val === null) return null;
                           const v = String(val).replace('%', '').trim();
                           if (!v) return null;
                           const parsed = parseFloat(v);
                           return isNaN(parsed) ? null : parsed;
                       };

                       const rubTarget = parseTarget(row[14]);
                       const plyTarget = parseTarget(row[15]);
                       const bwTarget = parseTarget(row[16]);
                       
                       if (rubTarget !== null) monthlyDataMap[month][year].scrapPercentRubber = rubTarget;
                       if (plyTarget !== null) monthlyDataMap[month][year].scrapPercentPlyChafer = plyTarget;
                       if (bwTarget !== null) monthlyDataMap[month][year].scrapPercentBW = bwTarget;
                    });
                }

                Object.keys(monthlyDataMap).forEach(m => {
                    Object.keys(monthlyDataMap[m]).forEach(y => {
                        const entry = monthlyDataMap[m][y];
                        if (entry.newProdWeight !== undefined) {
                             entry.prodWeight = entry.newProdWeight;
                        }
                        const fields = ['mxRubber','mxCbRubber','mxChmRubber','exRubber','clPlyRubber','clFabricRubber','clRbRubber','clRubber','clChRubber','ctChRubber','ctRbRubber','ctRubber','ctPlyRubber','ctBwRubber','bdRbRubber','bdPlyRubber','bdChRubber','bdBwRubber','curingRubber','rispRubber','rispPlyRubber','rispChRubber','exPlyRubber'];
                        fields.forEach(f => { if (entry[f] === undefined) entry[f] = 0; });
                    });
                });

                const newRows = newData.data ? newData.data.slice(0) : [];
                let colDateIdx = 0, colTypeIdx = 6, colSectionIdx = 7, colWeightIdx = 5; // Default mappings for old spreadsheet format
                const newHeaderRow = newRows.length > 0 ? newRows.shift() : null; // Remove and inspect the first row
                
                if (newHeaderRow && Array.isArray(newHeaderRow)) {
                    const dIdx = newHeaderRow.findIndex(h => String(h).toUpperCase().trim() === 'DATE');
                    const mIdx = newHeaderRow.findIndex(h => String(h).toUpperCase().trim() === 'MATERIAL' || String(h).toUpperCase().trim() === 'TYPE');
                    const sIdx = newHeaderRow.findIndex(h => String(h).toUpperCase().trim() === 'SECTION');
                    const wIdx = newHeaderRow.findIndex(h => String(h).toUpperCase().trim() === 'WEIGHT');
                    if (dIdx !== -1) colDateIdx = dIdx;
                    if (mIdx !== -1) colTypeIdx = mIdx;
                    if (sIdx !== -1) colSectionIdx = sIdx;
                    if (wIdx !== -1) colWeightIdx = wIdx;
                }

                newRows.forEach((row) => {
                    if (!row || row.length < Math.max(colDateIdx, colTypeIdx, colSectionIdx, colWeightIdx)) return;
                    
                    const dateStr = String(row[colDateIdx]).trim();
                    if (!dateStr) return;
                    let month, year;

                    if (dateStr.includes("/") || dateStr.includes("-")) {
                        const separator = dateStr.includes('/') ? '/' : '-';
                        const parts = dateStr.split(separator);
                        if (parts.length === 2) {
                            month = parseInt(parts[0]).toString().padStart(2, "0");
                            year = parts[1];
                        } else if (parts.length === 3) {
                            if (parts[0].length === 4) {
                                year = parts[0];
                                month = parseInt(parts[1]).toString().padStart(2, "0");
                            } else if (parts[2].length === 4) {
                                year = parts[2];
                                month = parseInt(parts[0]).toString().padStart(2, "0");
                            }
                        }
                    } else {
                        const d = new Date(dateStr);
                        if (!isNaN(d.getTime())) {
                            month = (d.getMonth() + 1).toString().padStart(2, "0");
                            year = d.getFullYear().toString();
                        }
                    }
                    if (!month || !year) return;
                    
                    // In some cases Date string won't parse properly and month ends up as "NaN", if so, try full parse
                    if (month === "NaN") {
                       const d = new Date(dateStr);
                       if (!isNaN(d.getTime())) {
                           month = (d.getMonth() + 1).toString().padStart(2, "0");
                           year = d.getFullYear().toString();
                       } else {
                           return; // Give up
                       }
                    }
                    
                    if (!monthlyDataMap[month]) monthlyDataMap[month] = {};
                    if (!monthlyDataMap[month][year]) {
                        monthlyDataMap[month][year] = { prodWeight: null, scrapPercentRubber: null, scrapPercentPlyChafer: null, scrapPercentBW: null };
                        const fields = ['mxRubber','mxCbRubber','mxChmRubber','exRubber','clPlyRubber','clFabricRubber','clRbRubber','clRubber','clChRubber','ctChRubber','ctRbRubber','ctRubber','ctPlyRubber','ctBwRubber','bdRbRubber','bdPlyRubber','bdChRubber','bdBwRubber','curingRubber','rispRubber','rispPlyRubber','rispChRubber','exPlyRubber'];
                        fields.forEach(f => { monthlyDataMap[month][year][f] = 0; });
                    }

                    const weight = parseFloat(String(row[colWeightIdx]).replace(/,/g, '')) || 0;
                    const scrapType = String(row[colTypeIdx]).trim().toUpperCase();
                    const section = String(row[colSectionIdx]).trim().toUpperCase();

                    const target = monthlyDataMap[month][year];

                    if ((section === 'MX' || section === 'MIXING') && scrapType === 'RUBBER') target.mxRubber += weight;
                    if ((section === 'MX' || section === 'MIXING') && (scrapType === 'CB' || scrapType === 'CARBON BLACK')) target.mxCbRubber += weight;
                    if ((section === 'MX' || section === 'MIXING') && (scrapType === 'CHM' || scrapType === 'CHEMICAL')) target.mxChmRubber += weight;
                    if ((section === 'EX' || section === 'EXTRUSION') && scrapType === 'RUBBER') target.exRubber += weight;
                    if ((section === 'EX' || section === 'EXTRUSION') && scrapType === 'PLY') target.exPlyRubber += weight;
                    if ((section === 'CL' || section === 'CALENDERING') && scrapType === 'PLY') target.clPlyRubber += weight;
                    if ((section === 'CL' || section === 'CALENDERING') && scrapType === 'FABRIC') target.clFabricRubber += weight;
                    if ((section === 'CL' || section === 'CALENDERING') && scrapType === 'RUBBER') target.clRbRubber += weight;
                    if ((section === 'CL' || section === 'CALENDERING') && (scrapType === 'CHAFER' || scrapType === 'CH')) target.clChRubber += weight;
                    if ((section === 'CT' || section === 'CUTTING') && (scrapType === 'CHAFER' || scrapType === 'CH')) target.ctChRubber += weight;
                    if ((section === 'CT' || section === 'CUTTING') && scrapType === 'RUBBER') target.ctRbRubber += weight;
                    if ((section === 'CT' || section === 'CUTTING') && (scrapType === 'PLY' || scrapType === 'CORD')) target.ctPlyRubber += weight; 
                    if ((section === 'CT' || section === 'CUTTING') && (scrapType === 'BW' || scrapType === 'BEAD WIRE')) target.ctBwRubber += weight;
                    if ((section === 'TB' || section === 'BD' || section === 'TIRE BUILDING') && scrapType === 'RUBBER') target.bdRbRubber += weight;
                    if ((section === 'TB' || section === 'BD' || section === 'TIRE BUILDING') && scrapType === 'PLY') target.bdPlyRubber += weight;
                    if ((section === 'TB' || section === 'BD' || section === 'TIRE BUILDING') && (scrapType === 'CHAFER' || scrapType === 'CH')) target.bdChRubber += weight;
                    if ((section === 'TB' || section === 'BD' || section === 'TIRE BUILDING') && (scrapType === 'BW' || scrapType === 'BEAD WIRE')) target.bdBwRubber += weight;
                    if ((section === 'CR' || section === 'CURING' || section === 'CUR' || section === 'CUR_RB') && scrapType === 'RUBBER') target.curingRubber += weight;
                    if ((section === 'RISP' || section === 'RUBBER INSPECTION') && scrapType === 'RUBBER') target.rispRubber += weight;
                    if ((section === 'RISP' || section === 'RUBBER INSPECTION') && scrapType === 'PLY') target.rispPlyRubber += weight;
                    if ((section === 'RISP' || section === 'RUBBER INSPECTION') && (scrapType === 'CHAFER' || scrapType === 'CH')) target.rispChRubber += weight;

                    target.clRubber = target.clRbRubber;
                    target.ctRubber = target.ctRbRubber;
                });

                Object.keys(monthlyDataMap).forEach(m => {
                    Object.keys(monthlyDataMap[m]).forEach(y => {
                        const target = monthlyDataMap[m][y];

                        let scrap = null;
                        if (category === 'MX_RB') scrap = target.mxRubber;
                        else if (category === 'MX_CB') scrap = target.mxCbRubber;
                        else if (category === 'MX_CHM') scrap = target.mxChmRubber;
                        else if (category === 'EX_RB') scrap = target.exRubber;
                        else if (category === 'CL_PLY') scrap = target.clPlyRubber;
                        else if (category === 'CL_FABRIC') scrap = target.clFabricRubber;
                        else if (category === 'CL_RB') scrap = target.clRbRubber;
                        else if (category === 'CL_CH') scrap = target.clChRubber;
                        else if (category === 'CT_CH') scrap = target.ctChRubber;
                        else if (category === 'CT_RB') scrap = target.ctRbRubber;
                        else if (category === 'CT_PLY') scrap = target.ctPlyRubber;
                        else if (category === 'CT_BW') scrap = target.ctBwRubber;
                        else if (category === 'BD_RB') scrap = target.bdRbRubber;
                        else if (category === 'BD_PLY') scrap = target.bdPlyRubber;
                        else if (category === 'BD_CH') scrap = target.bdChRubber;
                        else if (category === 'BD_BW') scrap = target.bdBwRubber;
                        else if (category === 'CUR_RB') scrap = target.curingRubber;
                        else if (category === 'RSIP_RB') scrap = target.rispRubber;
                        else if (category === 'RSIP_PLY') scrap = target.rispPlyRubber;
                        else if (category === 'RSIP_CH') scrap = target.rispChRubber;
                        else if (category === 'RUBBER ALL') scrap = target.mxRubber + target.exRubber + target.clRubber + target.ctRubber + target.curingRubber + target.rispRubber;
                        else if (category === 'PLY ALL') scrap = target.clPlyRubber + target.ctPlyRubber + target.bdPlyRubber + target.rispPlyRubber + target.exPlyRubber;
                        else if (category === 'BW ALL') scrap = target.ctBwRubber + target.bdBwRubber;
                        else if (category === 'CH ALL') scrap = target.clChRubber + target.ctChRubber + target.bdChRubber + target.rispChRubber;
                        else if (category === 'PLY/CH ALL') scrap = target.clPlyRubber + target.ctPlyRubber + target.bdPlyRubber + target.rispPlyRubber + target.exPlyRubber + target.clChRubber + target.ctChRubber + target.bdChRubber + target.rispChRubber;
                        else if (category === 'CT_CL PLY/CH ALL') scrap = target.clPlyRubber + target.ctPlyRubber + target.clChRubber + target.ctChRubber;

                        target.totalScrapWeight = scrap;
                        
                        if (scrap !== null && target.prodWeight !== null && target.prodWeight > 0) {
                            target.totalScrapRatio = (scrap / target.prodWeight) * 100;
                        } else {
                            target.totalScrapRatio = null;
                        }

                        target.totalPlyScrapWeight = target.clPlyRubber + target.ctPlyRubber + target.bdPlyRubber + target.rispPlyRubber + target.exPlyRubber;
                        target.totalChScrapWeight = target.clChRubber + target.ctChRubber + target.bdChRubber + target.rispChRubber;
                        target.ctClTotalPlyScrapWeight = target.clPlyRubber + target.ctPlyRubber;
                        target.ctClTotalChScrapWeight = target.clChRubber + target.ctChRubber;
                    });
                });

                const formattedData = Object.keys(monthlyDataMap)
                    .sort()
                    .map((month) => ({
                        month,
                        data: monthlyDataMap[month],
                    }));
                    
                return formattedData;
            } catch (error) {
                console.error("Error fetching scrap data:", error);
                throw error;
            }
        }

        const copyElementAsImage = async (element, lang, setIsCapturing) => {
            try {
                if (setIsCapturing) setIsCapturing(true);
                
                const originalCursor = element.style.cursor;
                element.style.cursor = 'wait';
                document.body.style.cursor = 'wait';
                
                // Wait for state to propagate and animations to stop
                await new Promise(resolve => setTimeout(resolve, setIsCapturing ? 500 : 50));

                const canvas = await html2canvas(element, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    useCORS: true,
                    allowTaint: false
                });
                
                canvas.toBlob(async (blob) => {
                    element.style.cursor = originalCursor;
                    document.body.style.cursor = '';
                    if (setIsCapturing) setIsCapturing(false);
                    
                    if (blob) {
                        try {
                            await navigator.clipboard.write([
                                new ClipboardItem({ 'image/png': blob })
                            ]);
                            alert(lang === 'zh' ? '已複製為圖片' : 'Copied as image');
                        } catch (err) {
                            console.error('Failed to copy image to clipboard', err);
                            alert(lang === 'zh' ? '複製失敗' : 'Failed to copy');
                        }
                    }
                }, 'image/png');
            } catch (err) {
                element.style.cursor = '';
                document.body.style.cursor = '';
                console.error('Failed to generate image', err);
            }
        };

        // --- Components ---
        // Chart Component
        const Chart = ({ 
            lang, 
            category, 
            primaryYear,
            compareYear,
            scrapPercentYear,
            chartType,
            data,
            pointStyles,
            onPointStyleChange,
            isCapturing,
            setIsCapturing
        }) => {
            const chartRef = useRef(null);

            if (!window.Recharts) {
                return <div className="w-full h-[400px] flex items-center justify-center text-white bg-[#333333]">Recharts Loading...</div>;
            }
            const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;
            const t = translations[lang];

            const getScrapPercentValue = (d, year) => {
                if (year === 'No') return null;
                if (chartType === 'weight') return null;
                
                const rubberCats = ['RUBBER ALL', 'MX_RB', 'MX_CB', 'MX_CHM', 'CL_RB', 'EX_RB', 'CT_RB', 'BD_RB', 'CUR_RB', 'RSIP_RB'];
                const plyChCats = ['PLY ALL', 'CH ALL', 'PLY/CH ALL', 'CT_CL PLY/CH ALL', 'CL_PLY', 'CL_CH', 'CT_PLY', 'CT_CH', 'BD_PLY', 'BD_CH', 'RSIP_PLY', 'RSIP_CH', 'EX_PLY', 'CL_FABRIC'];
                const bwCats = ['BW ALL', 'CT_BW', 'BD_BW'];

                if (rubberCats.includes(category)) return d.data[year]?.scrapPercentRubber;
                if (plyChCats.includes(category)) return d.data[year]?.scrapPercentPlyChafer;
                if (bwCats.includes(category)) return d.data[year]?.scrapPercentBW;
                return null;
            };

            const chartData = data.map(d => ({
                month: getMonthName(d.month, lang),
                originalMonth: d.month,
                primaryValue: chartType === 'weight' ? d.data[primaryYear]?.totalScrapWeight : d.data[primaryYear]?.totalScrapRatio,
                compareValue: chartType === 'weight' ? d.data[compareYear]?.totalScrapWeight : d.data[compareYear]?.totalScrapRatio,
                scrapPercentValue: getScrapPercentValue(d, scrapPercentYear),
            }));

            // Debug logging for desktop version issues
            console.log(`[Chart Debug] Rendering for ${category} - ${chartType}`);
            console.log(`[Chart Debug] Data length: ${chartData.length}`);
            console.log(`[Chart Debug] Sample point:`, chartData[0]);

            const formatYAxis = (tickItem) => {
                if (tickItem === null || tickItem === undefined) return "";
                if (chartType === 'weight') {
                    return Math.round(tickItem).toLocaleString("en-US");
                }
                return tickItem.toFixed(3);
            };

            const CustomTooltip = ({ active, payload, label }) => {
                if (active && payload && payload.length) {
                    return (
                        <div className="bg-zinc-900 border border-zinc-700 p-2 sm:p-3 rounded-lg shadow-lg z-50">
                            <p className="text-zinc-300 mb-1 sm:mb-2 text-sm sm:text-lg">{label}</p>
                            {payload.map((entry, index) => (
                                <p key={index} style={{ color: entry.color }} className="text-[12px] sm:text-base font-medium">
                                    {entry.name}: {chartType === 'weight' 
                                        ? (entry.value !== undefined && entry.value !== null ? Math.round(entry.value).toLocaleString("en-US") : "0") 
                                        : (entry.value !== undefined && entry.value !== null ? entry.value.toFixed(3) : "0.000")}
                                </p>
                            ))}
                        </div>
                    );
                }
                return null;
            };

            const CustomDot = (props) => {
                const { cx, cy, stroke, payload, dataKey } = props;
                if (!payload || !payload.originalMonth) return null;
                
                const value = payload[dataKey];
                if (value === null || value === undefined) return null;

                const year = dataKey === 'primaryValue' ? primaryYear : compareYear;
                const month = payload.originalMonth;
                const pointId = `${year}-${month}`;
                const style = pointStyles[pointId];
                const fillColor = style?.color || stroke;

                return (
                    <circle 
                        cx={cx} 
                        cy={cy} 
                        r={6} 
                        fill={fillColor} 
                        stroke="white" 
                        strokeWidth={2}
                    />
                );
            };

            const handleLabelClick = (year, month) => {
                const pointId = `${year}-${month}`;
                onPointStyleChange(prev => {
                    const currentStyle = prev[pointId];
                    if (currentStyle?.isRed) {
                        const { isRed, ...rest } = currentStyle;
                        return { ...prev, [pointId]: rest };
                    } else {
                        return { ...prev, [pointId]: { ...currentStyle, isRed: true } };
                    }
                });
            };

            const CustomLabelCompare = (props) => {
                const { x, y, value, index, payload } = props;
                if (value === null || value === undefined || typeof x !== 'number' || typeof y !== 'number') return null;
                
                const dataPoint = payload || chartData[index];
                if (!dataPoint) return null;

                const primaryVal = dataPoint.primaryValue;
                const isHigherOnScreen = primaryVal !== null && primaryVal !== undefined && value > primaryVal;
                
                const rectY = isHigherOnScreen ? -30 : 8;
                const textY = isHigherOnScreen ? -14 : 24;
                
                const year = compareYear;
                const month = dataPoint.originalMonth;
                if (!month) return null;

                const pointId = `${year}-${month}`;
                const style = pointStyles[pointId];
                const isRed = style?.isRed;

                return (
                    <g transform={`translate(${x},${y})`} onClick={(e) => { e.stopPropagation(); handleLabelClick(year, month); }} style={{ cursor: 'pointer' }}>
                        <rect x="-27.5" y={rectY} width="55" height="22" fill={isRed ? "#ff0000" : "#fff"} rx="4" ry="4" stroke="#000" strokeWidth="0.5" />
                        <text x="0" y={textY} dy="0" fill={isRed ? "#fff" : "#000"} fontSize="16" fontWeight="bold" textAnchor="middle">
                            {chartType === 'weight' ? Math.round(value).toLocaleString("en-US") : value.toFixed(3)}
                        </text>
                    </g>
                );
            };

            const CustomLabelScrap = (props) => {
                const { x, y, value, index, payload } = props;
                if (value === null || value === undefined || typeof x !== 'number' || typeof y !== 'number') return null;
                
                const dataPoint = payload || chartData[index];
                if (!dataPoint) return null;

                const year = scrapPercentYear;
                const month = dataPoint.originalMonth;
                if (!month) return null;

                return (
                    <g transform={`translate(${x},${y})`} onClick={(e) => { e.stopPropagation(); handleLabelClick(year, month); }} style={{ cursor: 'pointer' }}>
                        <rect x="-27.5" y="-30" width="55" height="22" fill="#FFD700" rx="4" ry="4" stroke="#fff" strokeWidth="0.5" />
                        <text x="0" y="-14" dy="0" fill="#000" fontSize="16" fontWeight="bold" textAnchor="middle">
                            {value.toFixed(3)}
                        </text>
                    </g>
                );
            };

            const CustomLabelPrimary = (props) => {
                const { x, y, value, index, payload } = props;
                if (value === null || value === undefined || typeof x !== 'number' || typeof y !== 'number') return null;
                
                const dataPoint = payload || chartData[index];
                if (!dataPoint) return null;

                const compareVal = dataPoint.compareValue;
                const isHigherOnScreen = compareVal === null || compareVal === undefined || value >= compareVal;
                
                const rectY = isHigherOnScreen ? -30 : 8;
                const textY = isHigherOnScreen ? -14 : 24;

                const year = primaryYear;
                const month = dataPoint.originalMonth;
                if (!month) return null;

                const pointId = `${year}-${month}`;
                const style = pointStyles[pointId];
                const isRed = style?.isRed;

                return (
                    <g transform={`translate(${x},${y})`} onClick={(e) => { e.stopPropagation(); handleLabelClick(year, month); }} style={{ cursor: 'pointer' }}>
                        <rect x="-27.5" y={rectY} width="55" height="22" fill={isRed ? "#ff0000" : "#00BFFF"} rx="4" ry="4" stroke="#fff" strokeWidth="0.5" />
                        <text x="0" y={textY} dy="0" fill={isRed ? "#fff" : "#000"} fontSize="16" fontWeight="bold" textAnchor="middle">
                            {chartType === 'weight' ? Math.round(value).toLocaleString("en-US") : value.toFixed(3)}
                        </text>
                    </g>
                );
            };

            const categoryName = lang === 'zh' ? (categoryNamesZh[category] || category) : (categoryNamesEn[category] || category);
            const chartTypeName = lang === 'zh' 
                ? (chartType === 'ratio' ? '報廢率' : '報廢重量') 
                : (chartType === 'ratio' ? 'Scrap Ratio' : 'Scrap Weight');
            const yearSuffix = lang === 'zh' ? '年' : '';

            return (
                <div 
                    ref={chartRef}
