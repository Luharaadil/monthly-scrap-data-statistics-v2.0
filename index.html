                                                data.forEach(d => allIds.push(`${r.labelEn}-${d.month}`));
                                            });
                                            onCellClick(e, 'all-cells', tableFontSize, allIds);
                                        }}
                                    >
                                        <div className="flex items-center justify-center">
                                            <svg className="w-4 h-4 text-green-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                                            </svg>
                                        </div>
                                    </th>
                                )}
                                <th 
                                    className={cn(
                                        "border border-gray-300 p-0.5 sm:p-2 text-left font-bold bg-[#90EE90] z-20",
                                        isCapturing ? "" : "sticky",
                                        !isCapturing && isEditMode ? "left-10" : "left-0"
                                    )}
                                    style={{ fontSize: `${tableFontSize + 2}px`, width: isCapturing ? '215px' : '175px' }}
                                >
                                    {t.months}
                                </th>
                                {months.map((month) => (
                                    <th
                                        key={month}
                                        className={cn(
                                            "border border-gray-300 p-0.5 sm:p-2 text-center font-medium transition-colors",
                                            isEditMode ? "cursor-pointer hover:bg-green-200" : ""
                                        )}
                                        style={{ fontSize: `${tableFontSize}px`, width: isCapturing ? '67px' : '62px' }}
                                        onClick={(e) => {
                                            if (isEditMode) {
                                                const columnIds = filteredRows.map(r => `${r.labelEn}-${month}`);
                                                onCellClick(e, `col-${month}`, tableFontSize, columnIds);
                                            }
                                        }}
                                        title={isEditMode ? (lang === 'zh' ? `選取 ${month} 整欄` : `Select all ${month}`) : ""}
                                    >
                                        {month}
                                    </th>
                                ))}
                            </tr>
                        </thead>
                        <tbody>
                            {filteredRows.map((row, idx) => {
                                const isCompareRow = row.year === compareYear;
                                const hasPrimaryRow = filteredRows.some(r => r.baseKey === row.baseKey && r.year === primaryYear);
                                const isExpanded = expandedRows[row.baseKey];
                                
                                if (isCompareRow && hasPrimaryRow && !isExpanded) {
                                    return null;
                                }

                                const labelId = `label-${row.baseKey}-${row.year}`;
                                const labelStyle = pointStyles[labelId] || {};
                                const labelFontSize = labelStyle.fontSize || tableFontSize;
                                
                                const rowCellIds = data.map(d => `${row.labelEn}-${d.month}`);
                                const allRowIds = [labelId, ...rowCellIds];

                                return (
                                    <tr key={idx} className={`h-10 sm:h-12 transition-colors ${isCompareRow ? 'bg-orange-50 hover:bg-orange-100' : 'bg-white hover:bg-gray-50'}`}>
                                        {isEditMode && (
                                            <td 
                                                className={cn(
                                                    "border border-gray-300 w-10 bg-gray-50 z-20 cursor-pointer hover:bg-blue-100 transition-colors text-center",
                                                    isCapturing ? "" : "sticky left-0"
                                                )}
                                                onClick={(e) => {
                                                    onCellClick(e, `row-selector-${idx}`, tableFontSize, allRowIds);
                                                }}
                                                title={lang === 'zh' ? '選取整列' : 'Select Row'}
                                            >
                                                <div className="flex items-center justify-center">
                                                    <svg className="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
                                                    </svg>
                                                </div>
                                            </td>
                                        )}
                                        <td
                                            className={cn(
                                                "border border-gray-300 whitespace-nowrap transition-all",
                                                isCapturing ? "" : "overflow-hidden",
                                                row.className,
                                                isCompareRow ? 'bg-orange-50' : 'bg-white cursor-pointer hover:bg-gray-100',
                                                isCapturing ? "" : "sticky z-10",
                                                !isCapturing && isEditMode ? "left-10" : "left-0",
                                                selectedCells.includes(labelId) ? "ring-2 ring-blue-500 ring-inset bg-blue-50" : ""
                                            )}
                                            style={{ fontSize: `${labelFontSize}px` }}
                                            onClick={(e) => {
                                                if (isEditMode) {
                                                    onCellClick(e, labelId, labelFontSize);
                                                } else {
                                                    if (!isCompareRow || !hasPrimaryRow) {
                                                        toggleRow(row.baseKey);
                                                    }
                                                }
                                            }}
                                            onContextMenu={(e) => {
                                                e.preventDefault();
                                                onCellClick(e, labelId, labelFontSize);
                                            }}
                                            title={lang === 'en' ? row.labelEn : row.labelZh}
                                        >
                                            <div className={cn(
                                                "flex items-center justify-start h-full w-full px-1 sm:px-3",
                                                isCapturing ? "" : "overflow-hidden"
                                            )}>
                                                <span className={isCapturing ? "" : "truncate"}>{lang === 'en' ? row.labelEn : row.labelZh}</span>
                                            </div>
                                        </td>
                                        {data.map((d, colIdx) => {
                                            const isHighlighted = row.className?.includes("bg-[#00BFFF]");
                                            const cellValue = row.getValue(d);
                                            const formattedValue = row.formatter(cellValue);
                                            // Use unique ID for each cell to ensure single cell highlighting
                                            const pointId = `${row.labelEn}-${d.month}`;
                                            const cellStyle = pointStyles[pointId] || {};
                                            const isRed = cellStyle.isRed;
                                            const cellFontSize = cellStyle.fontSize || tableFontSize;

                                            return (
                                                <td
                                                    key={d.month}
                                                    className={cn(
                                                        "border border-gray-300 text-center whitespace-nowrap cursor-pointer transition-all",
                                                        isCapturing ? "" : "overflow-hidden",
                                                        isHighlighted ? "bg-[#00BFFF]/20 text-blue-900 font-semibold" : "text-gray-700",
                                                        isRed ? "!bg-red-500 !text-white" : "",
                                                        selectedCells.includes(pointId) ? "ring-2 ring-blue-500 ring-inset !bg-blue-50 !text-blue-900" : ""
                                                    )}
                                                    style={{ fontSize: `${cellFontSize}px` }}
                                                    onClick={(e) => {
                                                        if (isEditMode) {
                                                            onCellClick(e, pointId, cellFontSize);
                                                        } else {
                                                            fetchAndShowDetails(row.labelEn, row.labelZh, d.month);
                                                        }
                                                    }}
                                                    title={formattedValue}
                                                >
                                                    <div className={cn(
                                                        "flex items-center justify-center h-full w-full px-0.5 sm:px-1",
                                                        isCapturing ? "" : "overflow-hidden"
                                                    )}>
                                                        <span className={cn(
                                                            "leading-none",
                                                            isCapturing ? "" : "truncate"
                                                        )}>{formattedValue}</span>
                                                    </div>
                                                </td>
                                            );
                                        })}
                                    </tr>
                                );
                            })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // Dashboard Component
        const Dashboard = () => {
            const currentYear = new Date().getFullYear().toString();
            const prevYear = (new Date().getFullYear() - 1).toString();
            
            const [lang, setLang] = useState('zh');
            const [category, setCategory] = useState('RUBBER ALL');
            const [primaryYear, setPrimaryYear] = useState(currentYear);
            const [compareYear, setCompareYear] = useState(prevYear);
            const [scrapPercentYear, setScrapPercentYear] = useState('No');
            const [chartType, setChartType] = useState('ratio');
            const [chartData, setChartData] = useState(fallbackData);
            const [loading, setLoading] = useState(false);
            const [isCapturing, setIsCapturing] = useState(false);
            const [pointStyles, setPointStyles] = useState(() => {
                const saved = localStorage.getItem('tablePointStyles');
                return saved ? JSON.parse(saved) : {};
            });
            const [selectedCells, setSelectedCells] = useState([]);
            const [expandedRows, setExpandedRows] = useState(() => {
                const saved = localStorage.getItem('tableExpandedRows');
                return saved ? JSON.parse(saved) : { prodWeight: true, totalScrapWeight: true, totalScrapRatio: true };
            });
            useEffect(() => {
                localStorage.setItem('tableExpandedRows', JSON.stringify(expandedRows));
            }, [expandedRows]);
            const [tableFontSize, setTableFontSize] = useState(() => {
                const saved = localStorage.getItem('tableGlobalFontSize');
                return saved ? parseInt(saved) : 14;
            });
            useEffect(() => {
                localStorage.setItem('tableGlobalFontSize', tableFontSize.toString());
            }, [tableFontSize]);
            const [isEditMode, setIsEditMode] = useState(false);
            const [editingCell, setEditingCell] = useState(null);
            const [editorPosition, setEditorPosition] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            const [isLocked, setIsLocked] = useState(false);
            const captureRef = useRef(null);

            // Handle dragging of the floating editor
            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (isDragging) {
                        setEditorPosition({
                            x: e.clientX - dragOffset.x,
                            y: e.clientY - dragOffset.y
                        });
                    }
                };

                const handleMouseUp = () => {
                    setIsDragging(false);
                };

                if (isDragging) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                }

                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isDragging, dragOffset]);

            // Reset editor position when a new cell is selected
            useEffect(() => {
                if (editingCell && !isLocked) {
                    setEditorPosition({
                        x: Math.min(window.innerWidth - 220, Math.max(10, editingCell.x + editingCell.width / 2 - 100)),
                        y: Math.min(window.innerHeight - 150, Math.max(10, editingCell.y - 120))
                    });
                }
            }, [editingCell?.id, isLocked]);

            // Persist pointStyles to localStorage
            useEffect(() => {
                localStorage.setItem('tablePointStyles', JSON.stringify(pointStyles));
            }, [pointStyles]);

            // Clear selection when leaving edit mode
            useEffect(() => {
                if (!isEditMode) {
                    setSelectedCells([]);
                    setEditingCell(null);
                }
            }, [isEditMode]);
            
            const t = translations[lang];

            // Removed reset of pointStyles on category change to persist font sizes across categories
            // useEffect(() => {
            //     setPointStyles({});
            // }, [category]);

            const handleScreenshot = async () => {
                if (!captureRef.current) return;
                setIsCapturing(true);
                
                try {
                    // Wait for React to apply the desktop-width classes and Recharts to resize
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                    const canvas = await html2canvas(captureRef.current, {
                        scale: 2,
                        backgroundColor: '#f9fafb',
                        logging: false,
                        useCORS: true,
                        allowTaint: false
                    });
                    
                    const blob = await new Promise((resolve) => {
                        try {
                            canvas.toBlob((b) => resolve(b), 'image/png');
                        } catch (e) {
                            console.error("toBlob failed", e);
                            resolve(null);
                        }
                    });
                    if (!blob) throw new Error("Failed to create image data");

                    // Ensure window is focused for clipboard API
                    window.focus();
                    
                    if (navigator.clipboard && navigator.clipboard.write) {
                        const item = new ClipboardItem({ 'image/png': blob });
                        await navigator.clipboard.write([item]);
                        alert(lang === 'zh' ? "截圖已複製到剪貼簿！" : "Screenshot copied to clipboard!");
                    } else {
                        // Fallback to download if clipboard API is unavailable
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `scrap-report-${new Date().getTime()}.png`;
                        link.click();
                        URL.revokeObjectURL(url);
                        alert(lang === 'zh' ? "您的瀏覽器不支援直接複製，圖片已自動下載。" : "Your browser doesn't support direct copy, image has been downloaded instead.");
                    }

                } catch (err) {
                    console.error("Screenshot failed", err);
                    // alert(lang === 'zh' ? "截圖失敗，請確保視窗處於焦點狀態並重試。" : "Screenshot failed. Please ensure the window is focused and try again.");
                } finally {
                    setIsCapturing(false);
                }
            };

            const handleClearCache = () => {
                // Clear storage
                try {
                    localStorage.clear();
                    sessionStorage.clear();
                } catch (e) {}
                
                // Unregister service workers
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister();
                        }
                    });
                }
                
                // Force reload
                window.location.reload();
            };

            useEffect(() => {
                if (categories.includes(category)) {
                    if (!isDataCached) setLoading(true);
                    fetchScrapData(category)
                        .then(data => {
                            setChartData(data);
                            setLoading(false);
                        })
                        .catch(err => {
                            console.error("Failed to fetch data", err);
                            setChartData(fallbackData);
                            setLoading(false);
                        });
                } else {
                    setChartData(fallbackData);
                }
            }, [category]);

            const availableYears = ["2026", "2025", "2024", "2023"];

            return (
                <div className="min-h-screen bg-gray-50 text-black font-sans flex flex-col">
                    {/* Controls Bar */}
                    <div className="bg-white border-b border-gray-200 p-4 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-[1920px] mx-auto flex flex-wrap gap-4 items-center justify-between">
                            <div className="flex flex-wrap gap-3 items-center">
                                <div className="flex items-center gap-2">
                                    <label className="text-base font-bold text-gray-800 whitespace-nowrap">{t.primaryYear}:</label>
                                    <select 
                                        value={primaryYear} 
                                        onChange={(e) => {
                                            const newPrimaryYear = e.target.value;
                                            setPrimaryYear(newPrimaryYear);
                                            const newCompareYear = (parseInt(newPrimaryYear) - 1).toString();
                                            if (availableYears.includes(newCompareYear)) {
                                                setCompareYear(newCompareYear);
                                            }
                                        }}
                                        className="bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2 font-medium shadow-sm outline-none"
                                    >
                                        {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
                                    </select>
                                </div>
                                <div className="flex items-center gap-2">
                                    <label className="text-base font-bold text-gray-800 whitespace-nowrap">{t.compareYear}:</label>
                                    <select 
                                        value={compareYear} 
                                        onChange={(e) => setCompareYear(e.target.value)}
                                        className="bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2 font-medium shadow-sm outline-none"
                                    >
                                        {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
                                    </select>
                                </div>
                                <div className="flex items-center gap-2">
                                    <label className="text-base font-bold text-gray-800 whitespace-nowrap">{t.category}:</label>
                                    <select 
                                        value={category} 
                                        onChange={(e) => setCategory(e.target.value)}
                                        className="bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2 font-medium shadow-sm outline-none"
                                    >
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div className="flex items-center gap-2">
                                    <label className="text-base font-bold text-gray-800 whitespace-nowrap">{lang === 'zh' ? '圖表類型' : 'Chart Type'}:</label>
                                    <select 
                                        value={chartType} 
                                        onChange={(e) => setChartType(e.target.value)}
                                        className="bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2 font-medium shadow-sm outline-none"
                                    >
                                        <option value="ratio">{lang === 'zh' ? '報廢率' : 'Scrap Ratio'}</option>
                                        <option value="weight">{lang === 'zh' ? '報廢重量 (KG)' : 'Scrap Weight (KG)'}</option>
                                    </select>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="flex items-center gap-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-600">
                                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                            <polyline points="14 2 14 8 20 8"></polyline>
                                            <text x="7" y="18" fill="currentColor" fontSize="6" fontWeight="bold" fontFamily="Arial">CSV</text>
                                        </svg>
                                        <label className="text-base font-bold text-gray-800 whitespace-nowrap">{lang === 'zh' ? 'CSV 年份' : 'CSV Year'}:</label>
                                    </div>
                                    <select 
                                        value={scrapPercentYear} 
                                        onChange={(e) => setScrapPercentYear(e.target.value)}
                                        className="bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2 font-medium shadow-sm outline-none"
                                    >
                                        <option value="No">No</option>
                                        {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
                                    </select>
                                </div>
                                <div className="flex items-center gap-2">
                                    <label className="text-base font-bold text-gray-800 whitespace-nowrap">{t.language}:</label>
                                    <select 
                                        value={lang} 
                                        onChange={(e) => setLang(e.target.value)}
                                        className="bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-md focus:ring-blue-500 focus:border-blue-500 block p-2 font-medium shadow-sm outline-none"
                                    >
                                        <option value="zh">繁體中文</option>
                                        <option value="en">English</option>
                                    </select>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 ml-auto">
                                <button
                                    onClick={() => setIsEditMode(!isEditMode)}
                                    className={cn(
                                        "flex items-center gap-2 px-3 py-2 rounded-md border-2 transition-all shadow-sm font-medium text-base",
                                        isEditMode 
                                            ? "bg-blue-600 text-white border-blue-600" 
                                            : "bg-white text-gray-700 border-gray-300 hover:border-blue-400"
                                    )}
                                    title={isEditMode ? t.done : t.adjustFont}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                                    </svg>
                                    {isEditMode ? t.done : t.adjustFont}
                                </button>
                                <button
                                    onClick={() => {
                                        setExpandedRows({ prodWeight: true, totalScrapWeight: true, totalScrapRatio: true });
                                        setTableFontSize(14);
                                        setPointStyles({});
                                    }}
                                    className="flex items-center gap-2 px-3 py-2 bg-gray-600 text-white text-base font-medium rounded-md hover:bg-gray-700 transition-colors shadow-sm"
                                    title={t.resetDefaults}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                                    {t.resetDefaults}
                                </button>
                                <button
                                    onClick={handleScreenshot}
                                    className="flex items-center gap-2 px-3 py-2 bg-blue-600 text-white text-base font-medium rounded-md hover:bg-blue-700 transition-colors shadow-sm"
                                    title={lang === 'zh' ? '複製截圖' : 'Copy Screenshot'}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                    {lang === 'zh' ? '複製' : 'Copy'}
                                </button>
                                <button
                                    onClick={() => setPointStyles({})}
                                    className="flex items-center gap-2 px-3 py-2 bg-red-500 text-white text-base font-medium rounded-md hover:bg-red-600 transition-colors shadow-sm"
                                    title={lang === 'zh' ? '清除所有標記' : 'Clear All Highlights'}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                                    {lang === 'zh' ? '清除' : 'Clear'}
                                </button>
                                <button
                                    onClick={handleClearCache}
                                    className="flex items-center gap-2 px-3 py-2 bg-orange-600 text-white text-base font-medium rounded-md hover:bg-orange-700 transition-colors shadow-sm"
                                    title={t.clearCache}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                                    {t.clearCache}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div 
                        ref={captureRef}
                        style={isCapturing ? { width: '1200px', minWidth: '1200px', backgroundColor: '#f9fafb' } : {}}
                        className={`flex-1 p-4 lg:p-6 mx-auto flex flex-col gap-6 ${isCapturing ? 'w-[1200px] max-w-[1200px]' : 'w-full max-w-[1920px]'}`}
                    >
                        <Chart 
                            lang={lang} 
                            category={category} 
                            primaryYear={primaryYear}
                            compareYear={compareYear}
                            scrapPercentYear={scrapPercentYear}
                            chartType={chartType}
                            data={chartData}
                            pointStyles={pointStyles}
                            onPointStyleChange={setPointStyles}
                            isCapturing={isCapturing}
                            setIsCapturing={setIsCapturing}
                        />
                        
                        <div className={`w-full bg-white rounded-2xl shadow-sm border-2 border-gray-400 flex-col relative ${isCapturing ? 'flex-none h-auto overflow-visible' : 'flex-1 overflow-hidden flex'}`}>
                            {loading && (
                                <div className="absolute inset-0 bg-white/50 backdrop-blur-sm z-50 flex items-center justify-center">
                                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                                </div>
                            )}
                            <div className="p-4 border-b-2 border-gray-300 bg-gray-50/50 flex flex-col sm:flex-row justify-between items-center gap-4">
                                <h2 className="text-lg font-bold text-gray-900">
                                    {compareYear}{lang === 'zh' ? '年' : ''}/{primaryYear}{lang === 'zh' ? '年' : ''} {lang === 'zh' ? (categoryNamesZh[category] || category) : (categoryNamesEn[category] || category)} {t.tableTitle}
                                </h2>
                            </div>
                            <div className={isCapturing ? 'overflow-visible' : 'flex-1 overflow-auto'}>
                                <DataTable 
                                    lang={lang} 
                                    primaryYear={primaryYear} 
                                    compareYear={compareYear} 
                                    scrapPercentYear={scrapPercentYear}
                                    data={chartData}
                                    category={category}
                                    pointStyles={pointStyles}
                                    onPointStyleChange={setPointStyles}
                                    isCapturing={isCapturing}
                                    setIsCapturing={setIsCapturing}
                                    expandedRows={expandedRows}
                                    setExpandedRows={setExpandedRows}
                                    tableFontSize={tableFontSize}
                                    isEditMode={isEditMode}
                                    selectedCells={selectedCells}
                                    onCellClick={(e, id, currentSize, bulkIds = []) => {
                                        const rect = e.currentTarget.getBoundingClientRect();
                                        
                                        setSelectedCells(prev => {
                                            if (bulkIds.length > 0) {
                                                // Check if all bulkIds are already selected
                                                const allSelected = bulkIds.every(bid => prev.includes(bid));
                                                if (allSelected) {
                                                    // Deselect all in this bulk
                                                    return prev.filter(item => !bulkIds.includes(item));
                                                } else {
                                                    // Select all in this bulk (additive)
                                                    const next = [...prev];
                                                    bulkIds.forEach(bid => {
                                                        if (!next.includes(bid)) next.push(bid);
                                                    });
                                                    return next;
                                                }
                                            }

                                            // Single cell toggle
                                            const isSelected = prev.includes(id);
                                            if (isSelected) {
                                                return prev.filter(item => item !== id);
                                            } else {
                                                return [...prev, id];
                                            }
                                        });

                                        setEditingCell({
                                            id,
                                            x: rect.left,
                                            y: rect.top,
                                            width: rect.width,
                                            height: rect.height,
                                            currentSize
                                        });
                                    }}
                                />
                            </div>
                        </div>

                        {/* Floating Cell Editor */}
                        {editingCell && (
                            <div 
                                className="fixed z-[100] bg-white border-2 border-blue-500 shadow-2xl rounded-lg p-3 flex flex-col gap-3 min-w-[260px]"
                                style={{ 
                                    left: editorPosition.x,
                                    top: editorPosition.y
                                }}
                            >
                                <div 
                                    className={cn(
                                        "flex justify-between items-center border-b pb-2 select-none",
                                        isLocked ? "cursor-default" : "cursor-move"
                                    )}
                                    onMouseDown={(e) => {
                                        if (isLocked) return;
                                        setIsDragging(true);
                                        setDragOffset({
                                            x: e.clientX - editorPosition.x,
                                            y: e.clientY - editorPosition.y
                                        });
                                    }}
                                >
                                    <div className="flex items-center gap-2">
                                        {!isLocked && (
                                            <svg className="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path>
                                            </svg>
                                        )}
                                        <span className="text-sm font-bold text-gray-700">{t.fontSize}</span>
                                    </div>
                                    <div className="flex items-center gap-1">
                                        <button 
                                            onClick={() => setIsLocked(!isLocked)} 
                                            className={cn(
                                                "p-1 rounded transition-colors",
                                                isLocked ? "text-blue-600 bg-blue-50" : "text-gray-400 hover:text-gray-600 hover:bg-gray-100"
                                            )}
                                            title={isLocked ? t.unlock : t.lock}
                                            onMouseDown={(e) => e.stopPropagation()}
                                        >
                                            {isLocked ? (
                                                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                                                </svg>
                                            ) : (
                                                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                                    <path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v3H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/>
                                                </svg>
                                            )}
                                        </button>
                                        <button 
                                            onClick={() => setEditingCell(null)} 
                                            className="text-gray-400 hover:text-gray-600 p-1 hover:bg-gray-100 rounded"
                                            onMouseDown={(e) => e.stopPropagation()}
                                        >
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        </button>
                                    </div>
                                </div>
                                <div className="flex items-center justify-between gap-4">
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={() => {
                                                const targets = selectedCells.length > 0 ? selectedCells : [editingCell.id];
                                                setPointStyles(prev => {
                                                    const next = { ...prev };
                                                    targets.forEach(tid => {
                                                        next[tid] = {
                                                            ...next[tid],
                                                            fontSize: Math.max(8, (next[tid]?.fontSize || tableFontSize) - 1)
                                                        };
                                                    });
                                                    return next;
                                                });
                                            }}
                                            className="w-10 h-10 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full text-xl font-bold transition-colors"
                                        >
                                            -
                                        </button>
                                        <input 
                                            type="number"
                                            value={selectedCells.length > 1 ? (pointStyles[selectedCells[0]]?.fontSize || tableFontSize) : (pointStyles[editingCell.id]?.fontSize || tableFontSize)}
                                            onChange={(e) => {
                                                const val = parseInt(e.target.value);
                                                if (isNaN(val)) return;
                                                const targets = selectedCells.length > 0 ? selectedCells : [editingCell.id];
                                                setPointStyles(prev => {
                                                    const next = { ...prev };
                                                    targets.forEach(tid => {
                                                        next[tid] = {
                                                            ...next[tid],
                                                            fontSize: Math.min(32, Math.max(8, val))
                                                        };
                                                    });
                                                    return next;
                                                });
                                            }}
                                            className="w-14 text-center font-bold text-blue-600 text-lg border border-blue-200 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                        <button 
                                            onClick={() => {
                                                const targets = selectedCells.length > 0 ? selectedCells : [editingCell.id];
                                                setPointStyles(prev => {
                                                    const next = { ...prev };
                                                    targets.forEach(tid => {
                                                        next[tid] = {
                                                            ...next[tid],
                                                            fontSize: Math.min(32, (next[tid]?.fontSize || tableFontSize) + 1)
                                                        };
                                                    });
                                                    return next;
                                                });
                                            }}
                                            className="w-10 h-10 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full text-xl font-bold transition-colors"
                                        >
                                            +
                                        </button>
                                    </div>
                                    <button 
                                        onClick={() => {
                                            const targets = selectedCells.length > 0 ? selectedCells : [editingCell.id];
                                            setPointStyles(prev => {
                                                const next = { ...prev };
                                                // Determine if we should turn on or off based on the first target
                                                const newState = !prev[targets[0]]?.isRed;
                                                targets.forEach(tid => {
                                                    next[tid] = {
                                                        ...next[tid],
                                                        isRed: newState
                                                    };
                                                });
                                                return next;
                                            });
                                        }}
                                        className={cn(
                                            "px-3 py-2 rounded font-bold text-sm transition-colors",
                                            (selectedCells.length > 0 ? pointStyles[selectedCells[0]]?.isRed : pointStyles[editingCell.id]?.isRed) ? "bg-red-500 text-white" : "bg-gray-200 text-gray-700 hover:bg-red-100"
                                        )}
                                    >
                                        {lang === 'zh' ? '標紅' : 'Red'}
                                    </button>
                                </div>
                                {selectedCells.length > 0 && (
                                    <div className="text-xs text-gray-500 border-t pt-2 flex justify-between items-center">
                                        <span>{lang === 'zh' ? `已選擇 ${selectedCells.length} ${t.cellsSelected}` : `${selectedCells.length} ${t.cellsSelected}`}</span>
                                        <button 
                                            onClick={() => setSelectedCells([])}
                                            className="text-blue-600 hover:underline"
                                        >
                                            {t.clearSelection}
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- App & Render ---
        const App = () => <Dashboard />;
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
